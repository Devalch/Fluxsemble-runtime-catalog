[workspace]
resolver = "2"
members = [
  "crates/catalog-core",
  "crates/catalog-acquire",
  "crates/catalog-sign",
  "crates/catalog-publish",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
url = "2"
