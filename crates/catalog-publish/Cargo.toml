[package]
name = "catalog-publish"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalog-core = { path = "../catalog-core" }
libc.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
catalog-core = { path = "../catalog-core", features = ["fixture-tools"] }
ed25519-dalek.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "catalog-publish"
path = "src/main.rs"

[[bin]]
name = "catalog-gh-broker"
path = "src/bin/catalog-gh-broker.rs"
