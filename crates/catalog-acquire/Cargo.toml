[package]
name = "catalog-acquire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalog-installer-verify = { path = "../catalog-installer-verify" }
base64 = "0.22"
catalog-core = { path = "../catalog-core" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "catalog-acquire"
path = "src/main.rs"

[dev-dependencies]
flate2 = "1"
xz2 = "0.1"
